{% extends 'users/_account_layout.html' %}
{% block title %}Профиль{% endblock %}
{% block account_content %}
<div class="account-form-container">
    <h2 class="account-form-title">Личные данные</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'includes/form_errors.html' %}
        {% for field in form %}{% include 'includes/form_field.html' %}{% endfor %}
        <button type="submit" class="button button--primary button--full-width">Сохранить</button>
    </form>
</div>
{% endblock %}
