{% extends 'users/_auth_layout.html' %}
{% block title %}Регистрация{% endblock %}
{% block auth_content %}
<div class="Legend"><h1 class="auth-title">Регистрация</h1></div>
<form method="post" class="auth-form" novalidate>
    {% csrf_token %}
    {% include 'includes/form_errors.html' %}
    {% for field in form %}
        {% include 'includes/form_field.html' %}
    {% endfor %}
    <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
    <div class="ButtonGroup">
        <button type="submit" class="button button--primary">Создать аккаунт</button>
    </div>
</form>
<p class="auth-switch">Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
{% endblock %}
