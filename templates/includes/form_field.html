<div class="InputField{% if field.errors %} InputField--error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small class="help-text">{{ field.help_text|safe }}</small>{% endif %}
    {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
