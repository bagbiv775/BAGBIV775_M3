[project]
name = "hop-and-barley"
version = "0.1.0"
description = "Интернет-магазин товаров для пивоварения на Django/DRF"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "django-filter>=26.2",
    "django-stubs-ext>=6.1.0",
    "graphene-django>=3.2.3",
    "psycopg[binary]>=3.3.4",
    "pillow>=12.0",
    "gunicorn>=23.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "mypy>=2.3",
    "django-stubs[compatible-mypy]>=6.1.0",
    "djangorestframework-stubs[compatible-mypy]>=3.18.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--reuse-db --strict-markers"
filterwarnings = [
    "ignore:No directory at:UserWarning",
    "ignore::DeprecationWarning:graphene.*",
    "ignore::DeprecationWarning:graphene_django.*",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/migrations/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "users", "products", "reviews", "orders", "analytics"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = false
exclude = ["migrations/", "tests/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["graphene.*", "graphene_django.*", "django_filters.*", "drf_spectacular.*", "rest_framework_simplejwt.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
